<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ---------------------------------- */
        /* --- Styles inherited from Admin Panel --- */
        /* ---------------------------------- */
        :root {
            --color-dark-bg: #1A1A2E; 
            --color-card-bg: #2C2C54; 
            --color-text-light: #E0E0E0;
            --color-accent: #6A6AFF; 
            --color-success: #00FFBB; 
            --color-input-bg: #3A3A69;
            --box-shadow-strong: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 10px rgba(70, 70, 150, 0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-dark-bg);
            color: var(--color-text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: var(--color-card-bg);
            border-radius: 15px;
            box-shadow: var(--box-shadow-strong);
            border: 1px solid #46467a;
            animation: fadeIn 0.8s ease-out;
            text-align: center;
        }

        h2 {
            color: var(--color-accent);
            padding-bottom: 10px;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h2 i {
            margin-right: 10px;
        }

        /* --- Form Elements --- */
        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="password"] {
            width: calc(100% - 24px); /* Full width with padding */
            padding: 12px;
            background: var(--color-input-bg);
            color: var(--color-text-light);
            border: 1px solid #46467a;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(106, 106, 255, 0.4);
            background: #3e3e75;
            outline: none;
        }

        /* --- Login Button --- */
        button[type="submit"] {
            background-color: var(--color-success);
            color: var(--color-dark-bg);
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 700;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #00e090;
            box-shadow: 0 5px 15px rgba(0, 255, 170, 0.3);
            transform: translateY(-2px);
        }

        /* --- Error/Hint Text --- */
        .error-message {
            color: var(--color-danger); /* Red */
            margin-top: 15px;
            font-weight: 500;
            display: none;
        }
        
        /* --- Animation --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2><i class="fas fa-lock"></i> Admin Panel Login</h2>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder="Username" required/>
            </div>
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password" required/>
            </div>
            
            <button type="submit">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
            
            <div id="errorMessage" class="error-message">
                Invalid username or password.
            </div>

            
        </form>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            errorMessage.style.display = 'none';

            const payload = { username: username, password: password };

            try {
                const res = await fetch('/admin_auth', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    // Redirect to the admin page on successful login
                    window.location.href = '/admin'; 
                } else {
                    // Show error message
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'Network or server error during login.';
                errorMessage.style.display = 'block';
            }
        };
    </script>
</body>
</html>
